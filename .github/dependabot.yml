# Weekly update proposals: dependencies, pinned actions and base images.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # Spring releases are aligned (Boot, Cloud, Data, Modulith, Security, Micrometer) and springdoc
      # targets a given Boot line: they must move together, in a single pull request.
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
          - "org.springdoc*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Pinned actions are reviewed and merged together.
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
