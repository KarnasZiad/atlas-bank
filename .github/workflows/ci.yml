name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly dependency audit
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a commit (a tag can be moved); Dependabot keeps them up to date.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests, web slices, architecture rules, then integration tests on real
      # PostgreSQL / Kafka / Redis started by Testcontainers.
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  stack:
    name: Full stack, image scan and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: ./mvnw -B -ntp -DskipTests package
      - name: Generate the local secrets
        run: bash scripts/init-env.sh
      - name: Start the stack
        run: |
          docker compose up -d --build
          # kafka-init exits once the ACLs are in place; wait for the services and the gateway to be healthy.
          for attempt in $(seq 1 90); do
            waiting=$(docker compose ps -a --format '{{.Service}} {{.Health}}' | grep -E -- '-service |api-gateway ' | grep -vc ' healthy$' || true)
            if [ "$waiting" -eq 0 ]; then docker compose ps -a; exit 0; fi
            sleep 10
          done
          docker compose ps -a
          exit 1
      # Critical vulnerabilities with an available fix fail the build.
      - name: Scan customer-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atlas-bank/customer-service:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan account-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atlas-bank/account-service:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan transaction-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atlas-bank/transaction-service:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan notification-service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atlas-bank/notification-service:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan api-gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: atlas-bank/api-gateway:local
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (onboarding, four eyes, transfers, notifications, books)
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  dependency-audit:
    name: Dependency vulnerabilities (OWASP)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP dependency-check (fails on CVSS >= 7)
        run: ./mvnw -B -ntp -DskipTests -Psecurity-scan verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
