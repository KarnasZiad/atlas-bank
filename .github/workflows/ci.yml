name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly dependency audit

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests, web slices, architecture rules, then integration tests on real
      # PostgreSQL / Kafka / Redis started by Testcontainers.
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  dependency-audit:
    name: Dependency vulnerabilities (OWASP)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP dependency-check (fails on CVSS >= 7)
        run: ./mvnw -B -ntp -DskipTests -Psecurity-scan verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
