# Atlas Bank - complete local stack.
#
#   1. ./scripts/init-env.sh  (generates .env with random secrets and the order-signing key pair)
#   2. ./mvnw -DskipTests package
#   3. docker compose up -d --build
#
# Only the API gateway (8080), Keycloak (8180) and Mailpit (8025) are published, on the loopback
# interface; the services are reachable exclusively through the gateway. PostgreSQL and Kafka are
# also bound to 127.0.0.1 for local debugging only.
#
# Least privilege everywhere: each service has its own database logins (schema owner for the
# migrations, restricted role at runtime) and its own Kafka principal, allowed by ACLs on its
# topics only (deploy/kafka/init-acls.sh).
name: atlas-bank

x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: 512m
  # Hardened runtime: read-only root filesystem, no Linux capability, no privilege escalation.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on: &platform-ready
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy

x-service-environment: &service-environment
  ATLAS_DB_HOST: postgres
  ATLAS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ATLAS_KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  ATLAS_KAFKA_SASL_MECHANISM: PLAIN
  # Tokens are issued for the public URL of Keycloak; keys are fetched over the internal network.
  ATLAS_OIDC_ISSUER_URI: http://localhost:8180/realms/atlas-bank
  ATLAS_OIDC_JWK_SET_URI: http://keycloak:8080/realms/atlas-bank/protocol/openid-connect/certs
  ATLAS_PUBLIC_API_URL: http://localhost:8080
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError

# Kafka principals (SASL/PLAIN over the private network; use SASL_SSL or mTLS anywhere else).
x-kafka-users: &kafka-users >-
  org.apache.kafka.common.security.plain.PlainLoginModule required
  username="admin" password="${KAFKA_ADMIN_PASSWORD:?}"
  user_admin="${KAFKA_ADMIN_PASSWORD:?}"
  user_customer-service="${KAFKA_CUSTOMER_SERVICE_PASSWORD:?}"
  user_account-service="${KAFKA_ACCOUNT_SERVICE_PASSWORD:?}"
  user_transaction-service="${KAFKA_TRANSACTION_SERVICE_PASSWORD:?}"
  user_notification-service="${KAFKA_NOTIFICATION_SERVICE_PASSWORD:?}";

services:
  # --- Platform -------------------------------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CUSTOMER_DB_OWNER_PASSWORD: ${CUSTOMER_DB_OWNER_PASSWORD:?}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?}
      ACCOUNT_DB_OWNER_PASSWORD: ${ACCOUNT_DB_OWNER_PASSWORD:?}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?}
      TRANSACTION_DB_OWNER_PASSWORD: ${TRANSACTION_DB_OWNER_PASSWORD:?}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?}
      NOTIFICATION_DB_OWNER_PASSWORD: ${NOTIFICATION_DB_OWNER_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: S8dAXYolTGqtBkUpgcm1-g
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      # Every listener authenticates, the controller one included: no anonymous client at all.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: *kafka-users
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: *kafka-users
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *kafka-users
      # Deny by default: a principal only gets what deploy/kafka/init-acls.sh grants it.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services (single topology definition), never created implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      # Not prefixed with KAFKA_: the image would turn it into a broker setting.
      ATLAS_KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
    volumes:
      - ./deploy/kafka:/opt/atlas:ro
    ports:
      - "127.0.0.1:9094:9094"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bash", "/opt/atlas/healthcheck.sh"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s

  # Grants each service principal its topics, then exits.
  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["bash", "/opt/atlas/init-acls.sh"]
    restart: "no"
    environment:
      ATLAS_KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:?}
    volumes:
      - ./deploy/kafka:/opt/atlas:ro
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65
      # Resolved by the realm import (placeholders in atlas-bank-realm.json).
      ATLAS_CUSTOMER_SERVICE_CLIENT_SECRET: ${ATLAS_CUSTOMER_SERVICE_CLIENT_SECRET:?}
      ATLAS_DEMO_ADMIN_PASSWORD: ${ATLAS_DEMO_ADMIN_PASSWORD:?}
      ATLAS_DEMO_EMPLOYEE_PASSWORD: ${ATLAS_DEMO_EMPLOYEE_PASSWORD:?}
      ATLAS_PUBLIC_API_URL: http://localhost:8080
    volumes:
      - ./deploy/keycloak/atlas-bank-realm.json:/opt/keycloak/data/import/atlas-bank-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q UP <&3']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local mailbox: it shows every e-mail, account activation links included, so it is only
  # reachable from this machine.
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 64m

  # --- Business services ----------------------------------------------------------------------
  customer-service:
    <<: *service-defaults
    image: atlas-bank/customer-service:local
    build:
      context: services/customer-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *service-environment
      ATLAS_DB_USERNAME: customer_svc
      ATLAS_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?}
      SPRING_FLYWAY_USER: customer_owner
      SPRING_FLYWAY_PASSWORD: ${CUSTOMER_DB_OWNER_PASSWORD:?}
      ATLAS_KAFKA_USERNAME: customer-service
      ATLAS_KAFKA_PASSWORD: ${KAFKA_CUSTOMER_SERVICE_PASSWORD:?}
      ATLAS_KEYCLOAK_URL: http://keycloak:8080
      ATLAS_CUSTOMER_SERVICE_CLIENT_SECRET: ${ATLAS_CUSTOMER_SERVICE_CLIENT_SECRET:?}
      ATLAS_PII_ENCRYPTION_PASSWORD: ${ATLAS_PII_ENCRYPTION_PASSWORD:?}
      ATLAS_PII_ENCRYPTION_SALT: ${ATLAS_PII_ENCRYPTION_SALT:?}
      ATLAS_PII_FINGERPRINT_KEY: ${ATLAS_PII_FINGERPRINT_KEY:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s

  account-service:
    <<: *service-defaults
    image: atlas-bank/account-service:local
    build:
      context: services/account-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *service-environment
      ATLAS_DB_USERNAME: account_svc
      ATLAS_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?}
      SPRING_FLYWAY_USER: account_owner
      SPRING_FLYWAY_PASSWORD: ${ACCOUNT_DB_OWNER_PASSWORD:?}
      ATLAS_KAFKA_USERNAME: account-service
      ATLAS_KAFKA_PASSWORD: ${KAFKA_ACCOUNT_SERVICE_PASSWORD:?}
      # Public half of the order-signing key: the ledger only posts orders signed by the transaction service.
      ATLAS_ORDER_SIGNING_KEY_ID: ${ATLAS_ORDER_SIGNING_KEY_ID:?}
      ATLAS_ORDER_SIGNING_PUBLIC_KEY: ${ATLAS_ORDER_SIGNING_PUBLIC_KEY:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s

  transaction-service:
    <<: *service-defaults
    image: atlas-bank/transaction-service:local
    build:
      context: services/transaction-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *service-environment
      ATLAS_DB_USERNAME: transaction_svc
      ATLAS_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?}
      SPRING_FLYWAY_USER: transaction_owner
      SPRING_FLYWAY_PASSWORD: ${TRANSACTION_DB_OWNER_PASSWORD:?}
      ATLAS_KAFKA_USERNAME: transaction-service
      ATLAS_KAFKA_PASSWORD: ${KAFKA_TRANSACTION_SERVICE_PASSWORD:?}
      ATLAS_ORDER_SIGNING_KEY_ID: ${ATLAS_ORDER_SIGNING_KEY_ID:?}
      ATLAS_ORDER_SIGNING_PRIVATE_KEY: ${ATLAS_ORDER_SIGNING_PRIVATE_KEY:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s

  notification-service:
    <<: *service-defaults
    image: atlas-bank/notification-service:local
    build:
      context: services/notification-service
      dockerfile: ../../Dockerfile
    depends_on:
      <<: *platform-ready
      mailpit:
        condition: service_started
    environment:
      <<: *service-environment
      ATLAS_DB_USERNAME: notification_svc
      ATLAS_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      SPRING_FLYWAY_USER: notification_owner
      SPRING_FLYWAY_PASSWORD: ${NOTIFICATION_DB_OWNER_PASSWORD:?}
      ATLAS_KAFKA_USERNAME: notification-service
      ATLAS_KAFKA_PASSWORD: ${KAFKA_NOTIFICATION_SERVICE_PASSWORD:?}
      ATLAS_SMTP_HOST: mailpit
      ATLAS_SMTP_PORT: "1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s

  # --- Edge -----------------------------------------------------------------------------------
  api-gateway:
    image: atlas-bank/api-gateway:local
    build:
      context: edge/api-gateway
      dockerfile: ../../Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ATLAS_OIDC_ISSUER_URI: http://localhost:8180/realms/atlas-bank
      ATLAS_OIDC_JWK_SET_URI: http://keycloak:8080/realms/atlas-bank/protocol/openid-connect/certs
      ATLAS_REDIS_HOST: redis
      ATLAS_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      ATLAS_CUSTOMER_SERVICE_URL: http://customer-service:8081
      ATLAS_ACCOUNT_SERVICE_URL: http://account-service:8082
      ATLAS_TRANSACTION_SERVICE_URL: http://transaction-service:8083
      ATLAS_NOTIFICATION_SERVICE_URL: http://notification-service:8084
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
