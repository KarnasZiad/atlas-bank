# Default (English) notification templates. Arguments are positional, see CustomerNotifier.
# MessageFormat syntax: a literal apostrophe is written ''.
notification.ACCOUNT_OPENED.subject=Your new account {1} is open
notification.ACCOUNT_OPENED.body=Hello {0},\n\nYour {2} account {1} in {3} is now open and ready to use.\n\nAtlas Bank
notification.ACCOUNT_STATUS_CHANGED.subject=Account {1}: status changed to {2}
notification.ACCOUNT_STATUS_CHANGED.body=Hello {0},\n\nThe status of your account {1} is now: {2}.\n\nIf you did not expect this change, please contact your branch.\n\nAtlas Bank
notification.TRANSFER_SENT.subject=Transfer of {1} sent
notification.TRANSFER_SENT.body=Hello {0},\n\nA transfer of {1} was debited from your account {2} to account {3}.\nReference: {4}\n\nIf you did not order this transfer, contact us immediately.\n\nAtlas Bank
notification.TRANSFER_RECEIVED.subject=You received {1}
notification.TRANSFER_RECEIVED.body=Hello {0},\n\nYour account {2} was credited with {1} from account {3}.\nReference: {4}\n\nAtlas Bank
notification.DEPOSIT_RECEIVED.subject=Cash deposit of {1}
notification.DEPOSIT_RECEIVED.body=Hello {0},\n\nA cash deposit of {1} was credited to your account {2}.\nReference: {3}\n\nAtlas Bank
notification.WITHDRAWAL_MADE.subject=Cash withdrawal of {1}
notification.WITHDRAWAL_MADE.body=Hello {0},\n\nA cash withdrawal of {1} was debited from your account {2}.\nReference: {3}\n\nIf you did not make this withdrawal, contact us immediately.\n\nAtlas Bank
notification.TRANSACTION_REJECTED.subject=Transaction {2} was not executed
notification.TRANSACTION_REJECTED.body=Hello {0},\n\nYour transaction {2} of {1} could not be executed (reason: {3}).\nNo money was moved.\n\nAtlas Bank

label.AccountType.CURRENT=current
