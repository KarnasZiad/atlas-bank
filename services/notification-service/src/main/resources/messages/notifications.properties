notification.CONTACT_DETAILS_CHANGED.subject=Your contact details were changed
notification.CONTACT_DETAILS_CHANGED.body=Hello {0},\n\nThe following details of your file were changed {2}: {1}.\n\nIf you did not make this change, contact your branch immediately: it may be an attempt at fraud.\n\nAtlas Bank
label.ContactChanges.PHONE_NUMBER=phone number
label.ContactChanges.POSTAL_ADDRESS=postal address
label.ContactChanges.PHONE_NUMBER_AND_POSTAL_ADDRESS=phone number and postal address
label.ChangedBy.CUSTOMER=from your online banking
label.ChangedBy.BANK=by your branch
