# Gabarits en français. Syntaxe MessageFormat : une apostrophe s'écrit ''.
notification.ACCOUNT_OPENED.subject=Votre nouveau compte {1} est ouvert
notification.ACCOUNT_OPENED.body=Bonjour {0},\n\nVotre compte {2} {1} en {3} est ouvert et prêt à être utilisé.\n\nAtlas Bank
notification.ACCOUNT_STATUS_CHANGED.subject=Compte {1} : nouveau statut {2}
notification.ACCOUNT_STATUS_CHANGED.body=Bonjour {0},\n\nLe statut de votre compte {1} est désormais : {2}.\n\nSi vous n''êtes pas à l''origine de ce changement, contactez votre agence.\n\nAtlas Bank
notification.TRANSFER_SENT.subject=Virement de {1} émis
notification.TRANSFER_SENT.body=Bonjour {0},\n\nUn virement de {1} a été débité de votre compte {2} vers le compte {3}.\nRéférence : {4}\n\nSi vous n''avez pas ordonné ce virement, contactez-nous immédiatement.\n\nAtlas Bank
notification.TRANSFER_RECEIVED.subject=Vous avez reçu {1}
notification.TRANSFER_RECEIVED.body=Bonjour {0},\n\nVotre compte {2} a été crédité de {1} en provenance du compte {3}.\nRéférence : {4}\n\nAtlas Bank
notification.DEPOSIT_RECEIVED.subject=Versement espèces de {1}
notification.DEPOSIT_RECEIVED.body=Bonjour {0},\n\nUn versement en espèces de {1} a été crédité sur votre compte {2}.\nRéférence : {3}\n\nAtlas Bank
notification.WITHDRAWAL_MADE.subject=Retrait espèces de {1}
notification.WITHDRAWAL_MADE.body=Bonjour {0},\n\nUn retrait en espèces de {1} a été débité de votre compte {2}.\nRéférence : {3}\n\nSi vous n''avez pas effectué ce retrait, contactez-nous immédiatement.\n\nAtlas Bank
notification.TRANSACTION_REJECTED.subject=L''opération {2} n''a pas été exécutée
notification.TRANSACTION_REJECTED.body=Bonjour {0},\n\nVotre opération {2} de {1} n''a pas pu être exécutée (motif : {3}).\nAucun mouvement n''a été effectué.\n\nAtlas Bank

